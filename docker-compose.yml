services:
  # Open-source HTTP reverse proxy and load balancer designed for cloud-native infrastructure,
  # microservices, and containerized environments.
  traefik:
    image: "traefik:v3.7.14" # Use a specific, stable version for reliability.
    container_name: "traefik"
    security_opt:
      - "no-new-privileges:true" # Hardening: no setuid/setgid elevation.
    deploy:
      resources:
        limits:
          memory: 256M # Traefik is efficient; 256MB is plenty.
    env_file:
      - path: .env
        required: false
    volumes:
      - ${ROOT_PATH:-.}/tools/traefik:/etc/traefik # Mount config directory (GitOps ready).
      - /var/run/docker.sock:/var/run/docker.sock:ro # Read-only access for service discovery.
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - iv0ks-dev
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.tls.certresolver=namecheap"
      - "traefik.http.routers.dashboard.tls.domains[0].main=*.iv0ks.dev"
      - "traefik.http.routers.dashboard.tls.domains[0].sans=iv0ks.dev"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.iv0ks.dev`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"

  # PHP download manager (Apache + mod_php in a single image) — path traversal
  # (CWE-22) lab. Apache serves static files and executes the PHP directly.
  ziphaven:
    build: .
    image: ghcr.io/iv0ks/ziphaven:v1.0.0
    container_name: ziphaven
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "8100:80" # direct access: http://localhost:8100
    networks:
      - iv0ks-dev
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ziphaven.rule=Host(`ziphaven.iv0ks.dev`)"
      - "traefik.http.routers.ziphaven.entrypoints=websecure"
      - "traefik.http.routers.ziphaven.tls=true"
      - "traefik.http.routers.ziphaven.tls.certresolver=namecheap"
      - "traefik.http.services.ziphaven.loadbalancer.server.port=80"

networks:
  iv0ks-dev:
    external: true
